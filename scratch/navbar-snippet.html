<style id="rcsc-nav-styles">
  /* ══ RCSC Floating Pill Navbar ══════════════════════════════════════════ */

  #rcsc-nav {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: rgba(10, 11, 13, 0.96);
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 9999px;
    box-shadow: 0 8px 32px -4px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.4s ease;
    white-space: nowrap;
  }
  #rcsc-nav.nav-hidden {
    transform: translateX(-50%) translateY(-130%);
    opacity: 0;
    pointer-events: none;
  }

  /* ── Logo ─────────────────────────────────────────────────────────────── */
  #rcsc-nav .n-logo {
    display: flex; align-items: center; gap: 8px;
    text-decoration: none; padding-right: 4px; flex-shrink: 0;
  }
  #rcsc-nav .n-logo img {
    width: 36px; height: 36px; object-fit: contain;
    border-radius: 50%; background: rgba(255,255,255,0.06);
  }
  #rcsc-nav .n-logo span {
    font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 0.03em;
  }

  /* ── Links container ──────────────────────────────────────────────────── */
  #rcsc-nav .n-links {
    position: relative; display: flex; align-items: center;
    background: rgba(255,255,255,0.05); border-radius: 9999px; padding: 4px;
  }

  /* ── Sliding pill ─────────────────────────────────────────────────────── */
  #rcsc-nav .n-pill {
    position: absolute; top: 4px; left: 0; height: calc(100% - 8px);
    background: rgba(255,255,255,0.14); border-radius: 9999px;
    pointer-events: none;
    transition: transform 0.42s cubic-bezier(0.16,1,0.3,1),
                width   0.42s cubic-bezier(0.16,1,0.3,1);
    will-change: transform, width;
  }

  /* ── Desktop link ─────────────────────────────────────────────────────── */
  #rcsc-nav .n-link {
    position: relative; z-index: 1; display: flex; align-items: center; gap: 4px;
    padding: 7px 14px; border-radius: 9999px; font-size: 13.5px; font-weight: 500;
    color: rgba(255,255,255,0.55); text-decoration: none;
    transition: color 0.2s ease; cursor: pointer;
    background: none; border: none; font-family: inherit;
  }
  #rcsc-nav .n-link:hover,
  #rcsc-nav .n-link.n-active { color: #fff; }

  /* ── Desktop dropdown ─────────────────────────────────────────────────── */
  #rcsc-nav .n-drop-wrap { position: relative; }
  #rcsc-nav .n-dropdown {
    display: none; position: absolute; top: calc(100% + 10px); left: 50%;
    transform: translateX(-50%); background: rgba(10,11,13,0.97);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
    padding: 6px; min-width: 150px;
    box-shadow: 0 12px 32px -4px rgba(0,0,0,0.5);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  #rcsc-nav .n-drop-wrap:hover .n-dropdown,
  #rcsc-nav .n-drop-wrap:focus-within .n-dropdown { display: block; }
  #rcsc-nav .n-dropdown a {
    display: block; padding: 8px 14px; border-radius: 8px;
    color: rgba(255,255,255,0.65); font-size: 13px; font-weight: 500;
    text-decoration: none; transition: background 0.15s, color 0.15s;
  }
  #rcsc-nav .n-dropdown a:hover { background: rgba(255,255,255,0.08); color: #fff; }
  #rcsc-nav .n-chevron {
    width: 10px; height: 10px; opacity: 0.6;
    transition: transform 0.2s; flex-shrink: 0;
  }
  #rcsc-nav .n-drop-wrap:hover .n-chevron { transform: rotate(180deg); }

  /* ── Icon span: shown only on mobile ─────────────────────────────────── */
  .n-icon {
    display: none;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  .n-icon svg { width: 20px; height: 20px; }

  /* ── Text label: expand-on-active (mobile only) ───────────────────────── */
  .n-text { } /* visible as-is on desktop */

  /* ── Items only shown on desktop ──────────────────────────────────────── */
  .n-desktop-only { }
  /* ── Items only shown on mobile ───────────────────────────────────────── */
  .n-mobile-only { display: none; }

  /* ── Floating theme toggle (outside nav) ─────────────────────────────── */
  #rcsc-theme-fab {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    width: 50px; height: 50px;
    background: rgba(10, 11, 13, 0.96);
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 9999px;
    box-shadow: 0 8px 32px -4px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    cursor: pointer;
    color: rgba(255,255,255,0.75);
    transition: color 0.2s, background 0.2s, transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.4s;
  }
  #rcsc-theme-fab:hover { color: #fff; background: rgba(30,32,36,0.98); }
  #rcsc-theme-fab svg { width: 18px; height: 18px; }
  #rcsc-theme-fab .icon-sun  { display: none; }
  #rcsc-theme-fab .icon-moon { display: block; }
  html[data-theme="dark"] #rcsc-theme-fab .icon-sun  { display: block; }
  html[data-theme="dark"] #rcsc-theme-fab .icon-moon { display: none; }
  /* On mobile: hide FAB (toggle lives in hamburger instead) */
  @media (max-width: 767px) {
    #rcsc-theme-fab { display: none; }
  }

  /* ── Hamburger / overflow menu ────────────────────────────────────────── */
  .n-menu-wrap {
    display: none; /* desktop: hidden */
    position: relative; flex-shrink: 0;
  }
  .n-menu-btn {
    display: flex; align-items: center; justify-content: center;
    width: 42px; height: 42px;
    background: rgba(255,255,255,0.08); border-radius: 9999px;
    border: none; cursor: pointer;
    color: rgba(255,255,255,0.65);
    transition: background 0.2s, color 0.2s;
    flex-shrink: 0;

  .n-menu-btn:hover      { background: rgba(255,255,255,0.14); color: #fff; }
  .n-menu-btn.n-active   { background: rgba(255,255,255,0.14); color: #fff; }
  .n-menu-btn svg { width: 18px; height: 18px; }

  #n-menu-dropdown {
    display: none;
    position: absolute; top: calc(100% + 10px); right: 0;
    background: rgba(10,11,13,0.97);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
    padding: 6px; min-width: 140px;
    box-shadow: 0 12px 32px -4px rgba(0,0,0,0.5);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    z-index: 10;
  }
  #n-menu-dropdown.open { display: block; }
  #n-menu-dropdown a {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 9px;
    color: rgba(255,255,255,0.65); font-size: 14px; font-weight: 500;
    text-decoration: none; transition: background 0.15s, color 0.15s;
  }
  #n-menu-dropdown a.n-active,
  #n-menu-dropdown a:hover { background: rgba(255,255,255,0.08); color: #fff; }
  #n-menu-dropdown a svg { width: 17px; height: 17px; flex-shrink: 0; }

  /* ══ Desktop / tablet ════════════════════════════════════════════════════ */
  @media (min-width: 768px) {
    .n-mobile-only { display: none !important; }
    .n-menu-wrap   { display: none !important; }
    #n-menu-dropdown { display: none !important; }
  }
  @media (max-width: 1023px) and (min-width: 768px) {
    #rcsc-nav .n-link { padding: 7px 10px; font-size: 12.5px; }
  }

  /* ══ Mobile ══════════════════════════════════════════════════════════════ */
  @media (max-width: 767px) {

    /* Full-width, slightly thicker pill */
    #rcsc-nav {
      left: 10px;
      right: 10px;
      transform: none;
      padding: 8px 10px 8px 6px; /* extra right so hamburger isn't clipped */
      gap: 4px;
    }

    /* Never hide on mobile */
    #rcsc-nav.nav-hidden {
      transform: none !important;
      opacity: 1 !important;
      pointer-events: auto !important;
    }

    /* Logo: image only, no text */
    #rcsc-nav .n-logo span { display: none; }
    #rcsc-nav .n-logo { padding-right: 0; }
    #rcsc-nav .n-logo img { width: 34px; height: 34px; }

    /* Links area: fill space, no inner background */
    #rcsc-nav .n-links {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      background: none;
      border-radius: 0;
      padding: 0;
    }

    /* Pill: flush inside the links area */
    #rcsc-nav .n-pill {
      top: 1px;
      height: calc(100% - 2px);
      background: rgba(255,255,255,0.15);
    }

    /* Each nav item: icon mode (horizontal, icon + collapsed label) */
    #rcsc-nav .n-link {
      flex-direction: row;
      justify-content: center;
      padding: 8px 10px;
      gap: 5px;
      color: rgba(255,255,255,0.4);
      font-size: 12.5px;
      font-weight: 500;
    }
    #rcsc-nav .n-link:hover,
    #rcsc-nav .n-link.n-active { color: #fff; }
    #rcsc-nav .n-link.n-active { padding: 8px 14px; }

    /* Icons: show */
    .n-icon { display: flex; }
    .n-icon svg { width: 20px; height: 20px; }

    /* Text label: collapsed → expands on active (sideways) */
    .n-text {
      display: block;
      max-width: 0;
      overflow: hidden;
      opacity: 0;
      white-space: nowrap;
      transition: max-width 0.4s cubic-bezier(0.16,1,0.3,1),
                  opacity   0.25s ease 0.08s;
    }
    .n-link.n-active .n-text {
      max-width: 72px;
      opacity: 1;
    }

    /* Desktop-only items: hide */
    .n-desktop-only  { display: none !important; }
    .n-desktop-drop  { display: none !important; }

    /* Mobile-only items: show */
    .n-mobile-only { display: flex !important; }

    /* Hamburger: show */
    .n-menu-wrap { display: flex; align-items: center; }

    /* Bottom nav: remove entirely */
    #rcsc-bottom-nav { display: none !important; }
    body { padding-bottom: 0 !important; }
  }
</style>

<script id="rcsc-nav-script">
(function () {
  /* ── Page detection ──────────────────────────────────────────────────── */
  const PAGE     = document.documentElement.dataset.page || '';
  const ACT_PAGES = ['activities','devsprint','chess-hub','science-fest','publication'];

  function matchesPage(p) {
    if (p === PAGE) return true;
    if (p === 'activities' && ACT_PAGES.includes(PAGE)) return true;
    return false;
  }

  /* ── Sliding pill ────────────────────────────────────────────────────── */
  const topLinks = document.getElementById('n-links');
  const topPill  = document.getElementById('n-pill');

  if (topLinks && topPill) {
    topLinks.querySelectorAll('[data-page]').forEach(el => {
      if (matchesPage(el.dataset.page)) el.classList.add('n-active');
    });

    const topActive = topLinks.querySelector('.n-active');

    function movePill(el, instant) {
      if (!el || !topPill || !topLinks) return;
      const lRect = topLinks.getBoundingClientRect();
      const eRect = el.getBoundingClientRect();
      const left  = eRect.left - lRect.left;
      if (instant) {
        topPill.style.transition = 'none';
        topPill.style.transform  = 'translateX(' + left + 'px)';
        topPill.style.width      = eRect.width + 'px';
        topPill.getBoundingClientRect(); /* force reflow */
        topPill.style.transition = '';
      } else {
        topPill.style.transform = 'translateX(' + left + 'px)';
        topPill.style.width     = eRect.width + 'px';
      }
    }

    if (topActive) {
      /* On mobile: briefly disable text transition so pill measures expanded width */
      var isMobile = window.innerWidth <= 767;
      if (isMobile) {
        topLinks.querySelectorAll('.n-text').forEach(function(t) {
          t.style.transition = 'none';
        });
      }
      requestAnimationFrame(function () {
        movePill(topActive, true);
        requestAnimationFrame(function () {
          if (isMobile) {
            topLinks.querySelectorAll('.n-text').forEach(function(t) {
              t.style.transition = '';
            });
          }
        });
      });
    } else {
      topPill.style.width   = '0';
      topPill.style.opacity = '0';
    }

    /* Desktop: hover slides the pill */
    topLinks.querySelectorAll('.n-link').forEach(function(link) {
      link.addEventListener('mouseenter', function() {
        if (window.innerWidth >= 768) movePill(link, false);
      });
    });
    topLinks.addEventListener('mouseleave', function() {
      if (window.innerWidth >= 768) {
        if (topActive) movePill(topActive, false);
        else { topPill.style.width = '0'; topPill.style.opacity = '0'; }
      }
    });

    window.addEventListener('resize', function() {
      if (topActive) movePill(topActive, true);
    });
  }

  /* ── Theme toggle (FAB on desktop, hamburger row on mobile) ─────────── */
  var themeBtn = document.getElementById('n-theme-btn'); // legacy — remove if exists
  if (themeBtn) themeBtn.remove();

  // Apply saved theme
  var savedTheme = localStorage.getItem('rcsc-theme') || 'light';
  document.documentElement.dataset.theme = savedTheme;

  function applyTheme(next) {
    document.documentElement.dataset.theme = next;
    localStorage.setItem('rcsc-theme', next);
    // Update hamburger row label + icon
    var row = document.getElementById('n-theme-row');
    var label = document.getElementById('n-theme-row-label');
    if (row) {
      row.querySelectorAll('.icon-moon').forEach(function(el){ el.style.display = next === 'dark' ? 'none' : 'block'; });
      row.querySelectorAll('.icon-sun').forEach(function(el){ el.style.display = next === 'dark' ? 'block' : 'none'; });
    }
    if (label) label.textContent = next === 'dark' ? 'Light Mode' : 'Dark Mode';
    // Notify contour lines
    window.dispatchEvent(new CustomEvent('rcsc-theme-change', { detail: { theme: next } }));
  }

  // Inject floating theme FAB (desktop)
  var fab = document.getElementById('rcsc-theme-fab');
  if (!fab) {
    fab = document.createElement('button');
    fab.id = 'rcsc-theme-fab';
    fab.setAttribute('aria-label', 'Toggle dark mode');
    fab.innerHTML = '<svg class="icon-moon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
    document.body.appendChild(fab);
  }
  fab.addEventListener('click', function() {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  // Hamburger row toggle
  var themeRow = document.getElementById('n-theme-row');
  if (themeRow) {
    // Set initial state
    applyTheme(savedTheme);
    themeRow.addEventListener('click', function(e) {
      e.stopPropagation();
      applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
  } else {
    applyTheme(savedTheme);
  }

  /* ── Hamburger menu (mobile: About + Blog) ───────────────────────────── */
  var menuBtn  = document.getElementById('n-menu-btn');
  var menuDrop = document.getElementById('n-menu-dropdown');

  if (menuBtn && menuDrop) {
    /* Highlight hamburger when About or Blog is the current page */
    if (PAGE === 'about' || PAGE === 'blog') {
      menuBtn.classList.add('n-active');
    }
    menuDrop.querySelectorAll('[data-page]').forEach(function(el) {
      if (el.dataset.page === PAGE) el.classList.add('n-active');
    });

    menuBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      menuDrop.classList.toggle('open');
    });
    document.addEventListener('click', function() {
      menuDrop.classList.remove('open');
    });
  }

  /* ── Scroll hide/show (desktop only) ────────────────────────────────── */
  var topNav = document.getElementById('rcsc-nav');
  var lastY  = window.scrollY;
  var ticking = false;

  window.addEventListener('scroll', function() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function() {
      if (window.innerWidth >= 768) {
        var y    = window.scrollY;
        var hide = y > lastY && y > 80;
        if (topNav) topNav.classList.toggle('nav-hidden', hide);
        lastY = y;
      }
      ticking = false;
    });
  }, { passive: true });
})();
</script>
<!-- [RCSC-NAV-END] -->
