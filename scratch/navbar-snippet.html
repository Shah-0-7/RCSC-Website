<style id="rcsc-nav-styles">
  /* ══ RCSC Floating Pill Navbar ══════════════════════════════════════════ */

  /* ── Top pill (base — applies on all screen sizes) ─────────────────── */
  #rcsc-nav {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: rgba(10, 11, 13, 0.96);
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 9999px;
    box-shadow: 0 8px 32px -4px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.4s ease;
    white-space: nowrap;
  }
  #rcsc-nav.nav-hidden {
    transform: translateX(-50%) translateY(-130%);
    opacity: 0;
    pointer-events: none;
  }

  /* Logo */
  #rcsc-nav .n-logo {
    display: flex; align-items: center; gap: 8px;
    text-decoration: none; padding-right: 4px; flex-shrink: 0;
  }
  #rcsc-nav .n-logo img {
    width: 36px; height: 36px; object-fit: contain;
    border-radius: 50%; background: rgba(255,255,255,0.06);
  }
  #rcsc-nav .n-logo span {
    font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 0.03em;
  }

  /* Links container */
  #rcsc-nav .n-links {
    position: relative; display: flex; align-items: center;
    background: rgba(255,255,255,0.05); border-radius: 9999px; padding: 4px;
  }
  /* Sliding pill */
  #rcsc-nav .n-pill {
    position: absolute; top: 4px; left: 0; height: calc(100% - 8px);
    background: rgba(255,255,255,0.14); border-radius: 9999px;
    pointer-events: none;
    transition: transform 0.42s cubic-bezier(0.16,1,0.3,1), width 0.42s cubic-bezier(0.16,1,0.3,1);
    will-change: transform, width;
  }

  /* Individual link */
  #rcsc-nav .n-link {
    position: relative; z-index: 1; display: flex; align-items: center; gap: 4px;
    padding: 7px 14px; border-radius: 9999px; font-size: 13.5px; font-weight: 500;
    color: rgba(255,255,255,0.55); text-decoration: none;
    transition: color 0.2s ease; cursor: pointer;
    background: none; border: none; font-family: inherit;
  }
  #rcsc-nav .n-link:hover,
  #rcsc-nav .n-link.n-active { color: #fff; }

  /* Dropdown (desktop) */
  #rcsc-nav .n-drop-wrap { position: relative; }
  #rcsc-nav .n-dropdown {
    display: none; position: absolute; top: calc(100% + 10px); left: 50%;
    transform: translateX(-50%); background: rgba(10,11,13,0.97);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
    padding: 6px; min-width: 150px;
    box-shadow: 0 12px 32px -4px rgba(0,0,0,0.5); backdrop-filter: blur(14px);
  }
  #rcsc-nav .n-drop-wrap:hover .n-dropdown,
  #rcsc-nav .n-drop-wrap:focus-within .n-dropdown { display: block; }
  #rcsc-nav .n-dropdown a {
    display: block; padding: 8px 14px; border-radius: 8px;
    color: rgba(255,255,255,0.65); font-size: 13px; font-weight: 500;
    text-decoration: none; transition: background 0.15s, color 0.15s;
  }
  #rcsc-nav .n-dropdown a:hover { background: rgba(255,255,255,0.08); color: #fff; }
  #rcsc-nav .n-chevron { width: 10px; height: 10px; opacity: 0.6; transition: transform 0.2s; flex-shrink: 0; }
  #rcsc-nav .n-drop-wrap:hover .n-chevron { transform: rotate(180deg); }

  /* Icon span: hidden on desktop, shown on mobile */
  .n-icon {
    display: none;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  .n-icon svg { width: 20px; height: 20px; }

  /* Text label: always shown on desktop */
  .n-text { }

  /* ── Desktop / tablet ── */
  @media (min-width: 768px) {
    #rcsc-nav .n-burger { display: none; }
  }
  @media (max-width: 1023px) and (min-width: 768px) {
    #rcsc-nav .n-link { padding: 7px 10px; font-size: 12.5px; }
  }

  /* ══ Mobile: single full-width top pill ════════════════════════════════ */
  @media (max-width: 767px) {

    /* Stretch pill edge-to-edge */
    #rcsc-nav {
      left: 10px;
      right: 10px;
      transform: none;
      padding: 5px 5px 5px 5px;
      gap: 2px;
    }

    /* Never hide on mobile — no scroll-hide */
    #rcsc-nav.nav-hidden {
      transform: none !important;
      opacity: 1 !important;
      pointer-events: auto !important;
    }

    /* Logo: image only, no text */
    #rcsc-nav .n-logo span { display: none; }
    #rcsc-nav .n-logo { padding-right: 0; flex-shrink: 0; }
    #rcsc-nav .n-logo img { width: 34px; height: 34px; }

    /* Links: fill remaining space, no background of their own */
    #rcsc-nav .n-links {
      flex: 1;
      display: flex;
      background: none;
      border-radius: 9999px;
      padding: 0;
      overflow: hidden;
    }

    /* Pill: flush inside n-links */
    #rcsc-nav .n-pill {
      top: 1px;
      height: calc(100% - 2px);
      background: rgba(255,255,255,0.14);
      border-radius: 9999px;
    }

    /* Each nav item: column layout, equal share */
    #rcsc-nav .n-link {
      flex: 1;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 5px 2px;
      gap: 2px;
      font-size: 9px;
      color: rgba(255,255,255,0.4);
      min-width: 0;
    }
    #rcsc-nav .n-link:hover,
    #rcsc-nav .n-link.n-active { color: #fff; }

    /* Icons: show on mobile */
    .n-icon { display: flex; }
    .n-icon svg { width: 18px; height: 18px; }

    /* Text: always visible, small */
    .n-text {
      display: block;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    /* Dropdown: disabled on mobile */
    #rcsc-nav .n-drop-wrap .n-dropdown { display: none !important; }
    #rcsc-nav .n-chevron { display: none !important; }

    /* Remove old bottom nav */
    #rcsc-bottom-nav { display: none !important; }

    /* Reset body padding from old bottom nav */
    body { padding-bottom: 0 !important; }
  }
</style>

<script id="rcsc-nav-script">
(function () {
  /* ── Page detection ──────────────────────────────────────────────────── */
  const PAGE = document.documentElement.dataset.page || '';
  const ACT_PAGES = ['activities', 'devsprint', 'chess-hub', 'science-fest', 'publication'];

  function matchesPage(itemPage) {
    if (itemPage === PAGE) return true;
    if (itemPage === 'activities' && ACT_PAGES.includes(PAGE)) return true;
    return false;
  }

  /* ── Sliding pill ────────────────────────────────────────────────────── */
  const topLinks = document.getElementById('n-links');
  const topPill  = document.getElementById('n-pill');

  if (topLinks && topPill) {
    // Mark active links
    topLinks.querySelectorAll('[data-page]').forEach(el => {
      if (matchesPage(el.dataset.page)) el.classList.add('n-active');
    });

    const topActive = topLinks.querySelector('.n-active');

    function movePill(el, instant) {
      if (!el || !topPill || !topLinks) return;
      const lRect = topLinks.getBoundingClientRect();
      const eRect = el.getBoundingClientRect();
      // Pill left: item offset from links container left edge
      const left = eRect.left - lRect.left;
      if (instant) {
        topPill.style.transition = 'none';
        topPill.style.transform = 'translateX(' + left + 'px)';
        topPill.style.width = eRect.width + 'px';
        topPill.getBoundingClientRect(); // force reflow
        topPill.style.transition = '';
      } else {
        topPill.style.transform = 'translateX(' + left + 'px)';
        topPill.style.width = eRect.width + 'px';
      }
    }

    if (topActive) {
      movePill(topActive, true);
    } else {
      topPill.style.width = '0';
      topPill.style.opacity = '0';
    }

    // Desktop: hover moves the pill
    topLinks.querySelectorAll('.n-link').forEach(link => {
      link.addEventListener('mouseenter', () => {
        if (window.innerWidth >= 768) movePill(link);
      });
    });
    topLinks.addEventListener('mouseleave', () => {
      if (window.innerWidth >= 768) {
        if (topActive) movePill(topActive);
        else { topPill.style.width = '0'; topPill.style.opacity = '0'; }
      }
    });

    window.addEventListener('resize', () => {
      if (topActive) movePill(topActive, true);
    });
  }

  /* ── Mobile: Activities button → navigate directly ───────────────────── */
  document.querySelectorAll('button.n-link[data-href]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (window.innerWidth <= 767) {
        window.location.href = btn.dataset.href;
      }
    });
  });

  /* ── Scroll hide/show (desktop only) ────────────────────────────────── */
  const topNav = document.getElementById('rcsc-nav');
  let lastY = window.scrollY, ticking = false;

  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      if (window.innerWidth >= 768) {
        const y = window.scrollY;
        const hide = y > lastY && y > 80;
        if (topNav) topNav.classList.toggle('nav-hidden', hide);
        lastY = y;
      }
      ticking = false;
    });
  }, { passive: true });
})();
</script>
