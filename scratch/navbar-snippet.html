<style id="rcsc-nav-styles">
  /* ══ RCSC Floating Pill Navbar ══════════════════════════════════════════ */

  /* ── Top pill ───────────────────────────────────────────────────── */
  #rcsc-nav {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px 6px 10px;
    background: rgba(10, 11, 13, 0.96);
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 9999px;
    box-shadow: 0 8px 32px -4px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.4s ease;
    white-space: nowrap;
  }
  #rcsc-nav.nav-hidden {
    transform: translateX(-50%) translateY(-130%);
    opacity: 0;
    pointer-events: none;
  }
  #rcsc-nav .n-logo {
    display: flex; align-items: center; gap: 8px;
    text-decoration: none; padding-right: 4px; flex-shrink: 0;
  }
  #rcsc-nav .n-logo img {
    width: 36px; height: 36px; object-fit: contain;
    border-radius: 50%; background: rgba(255,255,255,0.06);
  }
  #rcsc-nav .n-logo span {
    font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 0.03em;
  }
  #rcsc-nav .n-links {
    position: relative; display: flex; align-items: center;
    background: rgba(255,255,255,0.05); border-radius: 9999px; padding: 4px;
  }
  #rcsc-nav .n-pill {
    position: absolute; top: 4px; left: 4px; height: calc(100% - 8px);
    background: rgba(255,255,255,0.13); border-radius: 9999px;
    pointer-events: none;
    transition: transform 0.42s cubic-bezier(0.16,1,0.3,1), width 0.42s cubic-bezier(0.16,1,0.3,1);
    will-change: transform, width;
  }
  #rcsc-nav .n-link {
    position: relative; z-index: 1; display: flex; align-items: center; gap: 4px;
    padding: 7px 14px; border-radius: 9999px; font-size: 13.5px; font-weight: 500;
    color: rgba(255,255,255,0.55); text-decoration: none;
    transition: color 0.2s ease; cursor: pointer;
    background: none; border: none; font-family: inherit;
  }
  #rcsc-nav .n-link:hover, #rcsc-nav .n-link.n-active { color: #fff; }
  #rcsc-nav .n-drop-wrap { position: relative; }
  #rcsc-nav .n-dropdown {
    display: none; position: absolute; top: calc(100% + 10px); left: 50%;
    transform: translateX(-50%); background: rgba(10,11,13,0.97);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
    padding: 6px; min-width: 150px;
    box-shadow: 0 12px 32px -4px rgba(0,0,0,0.5); backdrop-filter: blur(14px);
  }
  #rcsc-nav .n-drop-wrap:hover .n-dropdown,
  #rcsc-nav .n-drop-wrap:focus-within .n-dropdown { display: block; }
  #rcsc-nav .n-dropdown a {
    display: block; padding: 8px 14px; border-radius: 8px;
    color: rgba(255,255,255,0.65); font-size: 13px; font-weight: 500;
    text-decoration: none; transition: background 0.15s, color 0.15s;
  }
  #rcsc-nav .n-dropdown a:hover { background: rgba(255,255,255,0.08); color: #fff; }
  #rcsc-nav .n-chevron { width: 10px; height: 10px; opacity: 0.6; transition: transform 0.2s; }
  #rcsc-nav .n-drop-wrap:hover .n-chevron { transform: rotate(180deg); }

  /* ── Desktop/tablet only ── */
  @media (min-width: 768px) {
    #rcsc-nav .n-burger { display: none; }
  }
  /* ── Mobile top nav: logo only, centered ── */
  @media (max-width: 767px) {
    #rcsc-nav .n-links { display: none; }
    #rcsc-nav .n-logo span { display: none; }
    #rcsc-nav { justify-content: center; padding: 6px; gap: 0; }
  }
  /* Tablet: smaller links */
  @media (max-width: 1023px) and (min-width: 768px) {
    #rcsc-nav .n-link { padding: 7px 10px; font-size: 12.5px; }
  }

  /* ══ Mobile bottom nav ════════════════════════════════════════════════ */
  #rcsc-bottom-nav {
    display: none;
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    align-items: center;
    gap: 2px;
    padding: 6px;
    background: rgba(10, 11, 13, 0.96);
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 9999px;
    box-shadow: 0 8px 32px -4px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    white-space: nowrap;
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.4s ease;
  }
  #rcsc-bottom-nav.nav-hidden {
    transform: translateX(-50%) translateY(130%);
    opacity: 0; pointer-events: none;
  }
  @media (max-width: 767px) {
    #rcsc-bottom-nav { display: flex; }
  }

  /* ── Sliding background pill ── */
  #bbn-pill {
    position: absolute;
    top: 6px;
    height: calc(100% - 12px);
    background: rgba(255,255,255,0.12);
    border-radius: 9999px;
    pointer-events: none;
    transition: left 0.42s cubic-bezier(0.16,1,0.3,1), width 0.42s cubic-bezier(0.16,1,0.3,1);
    will-change: left, width;
  }

  /* ── Each nav item ── */
  .bbn-item {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 10px;
    border-radius: 9999px;
    text-decoration: none;
    color: rgba(255,255,255,0.4);
    transition: color 0.25s ease, padding 0.4s cubic-bezier(0.16,1,0.3,1);
    cursor: pointer;
    flex-shrink: 0;
  }
  .bbn-item.bbn-active { color: #fff; padding: 9px 15px; }
  .bbn-item:hover:not(.bbn-active) { color: rgba(255,255,255,0.75); }

  /* Label — only shown on active item */
  .bbn-label {
    font-size: 13px; font-weight: 500; letter-spacing: 0.01em;
    max-width: 0; overflow: hidden; opacity: 0;
    transition: max-width 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.25s ease 0.1s;
    white-space: nowrap;
  }
  .bbn-item.bbn-active .bbn-label { max-width: 60px; opacity: 1; }

  /* ── SVG icon size ── */
  .bbn-item svg { width: 20px; height: 20px; flex-shrink: 0; }

  /* ══ Icon animations ════════════════════════════════════════════════════ */

  /* Draw (stroke-dashoffset) — Home door, Activities checkmark */
  .bn-draw {
    stroke-dasharray: 30;
    stroke-dashoffset: 30;
    transition: stroke-dashoffset 0.4s ease;
  }
  .bbn-item.bbn-active .bn-draw,
  .bbn-item:hover .bn-draw { stroke-dashoffset: 0; }

  /* Wobble — About/Info */
  @keyframes bnWobble {
    0%   { transform: rotate(0) scale(1); }
    25%  { transform: rotate(-2deg) scale(1.1); }
    75%  { transform: rotate(2deg) scale(0.95); }
    100% { transform: rotate(0) scale(1); }
  }
  .bbn-item.bbn-active .bn-wobble,
  .bbn-item:hover .bn-wobble { animation: bnWobble 0.65s ease-in-out; }

  /* Phone ring — Contact */
  @keyframes bnRing {
    0%, 100% { transform: rotate(0); }
    15%  { transform: rotate(-10deg); }
    30%  { transform: rotate(10deg); }
    45%  { transform: rotate(-10deg); }
    60%  { transform: rotate(10deg); }
    75%  { transform: rotate(-5deg); }
    90%  { transform: rotate(5deg); }
  }
  .bbn-item.bbn-active .bn-ring,
  .bbn-item:hover .bn-ring { animation: bnRing 0.6s ease-in-out; }

  /* Pulse — dots on Info icon */
  @keyframes bnPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%  { transform: scale(1.4); opacity: 0.6; }
  }
  .bbn-item.bbn-active .bn-pulse,
  .bbn-item:hover .bn-pulse { animation: bnPulse 0.5s ease-in-out; }

  /* Gallery fade-slide */
  @keyframes bnSlide {
    from { opacity: 0.4; transform: translateY(3px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .bbn-item.bbn-active .bn-slide,
  .bbn-item:hover .bn-slide { animation: bnSlide 0.35s ease; }

  /* Blog bounce */
  @keyframes bnBounce {
    0%, 100% { transform: scale(1); }
    40%  { transform: scale(1.15); }
    70%  { transform: scale(0.9); }
  }
  .bbn-item.bbn-active .bn-bounce,
  .bbn-item:hover .bn-bounce { animation: bnBounce 0.5s ease; }

  /* Account stroke-dash (CSS fallback for SMIL) */
  .bn-acc-path { stroke-dasharray: 28; stroke-dashoffset: 28; transition: stroke-dashoffset 0.35s ease; }
  .bn-acc-path2 { stroke-dasharray: 28; stroke-dashoffset: 28; transition: stroke-dashoffset 0.35s ease 0.35s; }
  .bbn-item.bbn-active .bn-acc-path,
  .bbn-item:hover .bn-acc-path { stroke-dashoffset: 0; }
  .bbn-item.bbn-active .bn-acc-path2,
  .bbn-item:hover .bn-acc-path2 { stroke-dashoffset: 0; }

  /* Body bottom padding so content isn't hidden behind bottom nav */
  @media (max-width: 767px) {
    body { padding-bottom: 80px !important; }
  }
</style>

<script id="rcsc-nav-script">
(function () {
  // ── Page detection ───────────────────────────────────────────────────────
  const PAGE = document.documentElement.dataset.page || '';

  // Pages that map to the "activities" bottom nav item
  const ACT_PAGES = ['activities', 'devsprint', 'chess-hub', 'science-fest', 'publication'];

  function matchesPage(itemPage) {
    if (itemPage === PAGE) return true;
    if (itemPage === 'activities' && ACT_PAGES.includes(PAGE)) return true;
    return false;
  }

  // ── Desktop top pill: sliding highlight ──────────────────────────────────
  const topLinks = document.getElementById('n-links');
  const topPill  = document.getElementById('n-pill');

  if (topLinks && topPill) {
    // Mark active
    topLinks.querySelectorAll('[data-page]').forEach(el => {
      if (matchesPage(el.dataset.page)) el.classList.add('n-active');
    });

    const topActive = topLinks.querySelector('.n-active');

    function movePill(el, instant) {
      if (!el || !topPill || !topLinks) return;
      const lRect = topLinks.getBoundingClientRect();
      const eRect = el.getBoundingClientRect();
      const left = eRect.left - lRect.left - 4;
      if (instant) {
        topPill.style.transition = 'none';
        topPill.style.transform = `translateX(${left}px)`;
        topPill.style.width = eRect.width + 'px';
        topPill.getBoundingClientRect();
        topPill.style.transition = '';
      } else {
        topPill.style.transform = `translateX(${left}px)`;
        topPill.style.width = eRect.width + 'px';
      }
    }

    if (topActive) movePill(topActive, true);
    else { topPill.style.width = '0'; topPill.style.opacity = '0'; }

    topLinks.querySelectorAll('.n-link').forEach(link => {
      link.addEventListener('mouseenter', () => movePill(link));
    });
    topLinks.addEventListener('mouseleave', () => {
      if (topActive) movePill(topActive);
      else { topPill.style.width = '0'; topPill.style.opacity = '0'; }
    });

    window.addEventListener('resize', () => {
      if (topActive) movePill(topActive, true);
    });
  }

  // ── Mobile bottom nav: sliding pill ─────────────────────────────────────
  const bottomNav = document.getElementById('rcsc-bottom-nav');
  const bbnPill   = document.getElementById('bbn-pill');
  const bbnItems  = document.querySelectorAll('.bbn-item');

  let activeBbn = null;

  function positionBbnPill(item, instant) {
    if (!item || !bbnPill || !bottomNav) return;
    const navRect  = bottomNav.getBoundingClientRect();
    const itemRect = item.getBoundingClientRect();
    const left = itemRect.left - navRect.left;
    if (instant) {
      bbnPill.style.transition = 'none';
      bbnPill.style.left  = left + 'px';
      bbnPill.style.width = itemRect.width + 'px';
      bbnPill.getBoundingClientRect();
      bbnPill.style.transition = '';
    } else {
      bbnPill.style.left  = left + 'px';
      bbnPill.style.width = itemRect.width + 'px';
    }
  }

  function activateBbn(item, instant) {
    bbnItems.forEach(i => i.classList.remove('bbn-active'));
    item.classList.add('bbn-active');
    activeBbn = item;
    // Wait a frame so the label expands before we measure
    requestAnimationFrame(() => positionBbnPill(item, instant));
  }

  // Set initial active state
  bbnItems.forEach(item => {
    if (matchesPage(item.dataset.page)) {
      activateBbn(item, true);
    }
  });

  // Click handlers (non-active items only animate, then navigate)
  bbnItems.forEach(item => {
    item.addEventListener('click', (e) => {
      if (item.classList.contains('bbn-active')) return;
      e.preventDefault();
      const href = item.getAttribute('href');
      activateBbn(item, false);
      // Navigate after animation
      setTimeout(() => { window.location.href = href; }, 320);
    });
  });

  window.addEventListener('resize', () => {
    if (activeBbn) positionBbnPill(activeBbn, true);
  });

  // ── Scroll hide/show (both navs) ─────────────────────────────────────────
  const topNav = document.getElementById('rcsc-nav');
  let lastY = window.scrollY, ticking = false;

  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const y = window.scrollY;
      const hide = y > lastY && y > 80;
      if (topNav) topNav.classList.toggle('nav-hidden', hide);
      if (bottomNav) bottomNav.classList.toggle('nav-hidden', hide);
      lastY = y; ticking = false;
    });
  }, { passive: true });
})();
</script>
